[alphavantage_daily]
DATETIME_CONFIG =
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%fZ
TIME_PREFIX = \"date\": \"
category = Custom
pulldown_type = 1

[tiingo_stock_endofday]
DATETIME_CONFIG =
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TIME_FORMAT = %Y-%m-%d
TIME_PREFIX = \"date\": \"
# Tiingo's trading day is a UTC date (the range endpoint says T00:00:00.000Z).
# The input also sets each event's time explicitly; without TZ a non-UTC
# Splunk put the day at local midnight, the previous day in UTC east of GMT.
TZ = UTC
category = Custom
pulldown_type = 1
