version: 2
updates:
  - package-ecosystem: "pip"
    target-branch: "main"
    directories:
      - "/"
      - "/package/lib/"
    schedule:
      interval: "daily"
    groups:
      splunk:
        applies-to: version-updates
        patterns:
          - "splunk*"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
